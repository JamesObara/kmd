<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMD-AI | SYNOP & METAR Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>

    <nav class="ai-nav">
        <div class="nav-brand">
            <img src="https://meteo.go.ke/media/images/logo_SbGqHxa.original.png" alt="KMD Logo">
            <div class="brand-divider"></div>
            <div class="nav-title">
                <h1>KMD-AI</h1>
                <span>SYNOP & METAR Assistant</span>
            </div>
        </div>
        <div class="nav-links">
            <!-- <a href="#">Resources</a>
            <button class="btn-say-hello">Sync Data</button> -->
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h2 class="animate-text">Turn Observations into <br><span>SYNOP & METAR Tables.</span></h2>
            <p>Step through your raw weather data below. Our AI handles the coding, formatting, and validation instantly.</p>
        </div>
    </section>

    <div class="command-center">
        <div class="input-card">

            <div class="progress-bar" id="progress-bar"></div>

            <div class="summary-chips" id="summary-chips">
                <span class="chips-placeholder">Completed fields will appear here</span>
            </div>

            <div class="step-card" id="step-card"></div>

        </div>
    </div>

<div id="result-modal" class="modal-overlay hidden">
    <div class="modal-container">

        <div class="modal-header">
            <h3>Generated Output</h3>
            <button id="close-modal"><i class="ti ti-x"></i></button>
        </div>

        <div class="modal-tabs">
            <button class="tab active" data-tab="synop">SYNOP</button>
            <button class="tab" data-tab="metar">METAR</button>
            <div class="tab-indicator"></div>
        </div>

        <div class="modal-body">
            <div class="tab-content active" id="synop-content">
            </div>

            <div class="tab-content" id="metar-content">
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-copy" id="copy-output">
                <i class="ti ti-copy"></i> Copy
            </button>
            <button class="btn-close" id="close-modal-2">Close</button>
        </div>

    </div>
</div>

    <script type="module" src="app.js"></script>
</body>
</html>
